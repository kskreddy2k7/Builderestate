---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildestate-config
  namespace: buildestate
data:
  redis-host: "redis-master.buildestate.svc.cluster.local"
  api-url: "https://api.buildestate.in/api/v1"
  app-url: "https://app.buildestate.in"
  node-env: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: buildestate-secrets
  namespace: buildestate
type: Opaque
stringData:
  # Replace with real secrets via kubectl create secret or external-secrets-operator
  database-url: "postgresql://buildestate:REPLACE_ME@rds-endpoint:5432/buildestate_prod"
  jwt-secret: "REPLACE_WITH_MIN_32_CHAR_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_MIN_32_CHAR_REFRESH_SECRET"
  aws-access-key-id: "REPLACE_ME"
  aws-secret-access-key: "REPLACE_ME"
  razorpay-key-id: "REPLACE_ME"
  razorpay-key-secret: "REPLACE_ME"
  openai-api-key: "REPLACE_ME"
