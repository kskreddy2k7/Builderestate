---
# ─── Web Deployment ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildestate-web
  namespace: buildestate
  labels:
    app: buildestate-web
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: buildestate-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: buildestate-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: buildestate/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: buildestate-config
                  key: api-url
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: buildestate-config
                  key: app-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: buildestate-web
  namespace: buildestate
spec:
  selector:
    app: buildestate-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
# ─── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildestate-ingress
  namespace: buildestate
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  tls:
    - hosts:
        - app.buildestate.in
        - api.buildestate.in
      secretName: buildestate-tls
  rules:
    - host: app.buildestate.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildestate-web
                port:
                  number: 3000
    - host: api.buildestate.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildestate-api
                port:
                  number: 4000
